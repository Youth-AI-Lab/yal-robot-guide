" ><rect x="12.000000" y="12.000000" width="596.000000" height="461.000000" stroke="#ffffff" fill="#ffffff" style="stroke-width:2;" /></g></g><g class="bGFkZGVyLmh1bWFu part"><g class="shape" ><rect x="30.000000" y="30.000000" width="560.000000" height="89.000000" rx="8.000000" stroke="#475569" fill="#ffffff" style="stroke-width:2;" /></g><text x="310.000000" y="65.000000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:15px"><tspan x="310.000000" dy="0.000000">Human, the slowest: about a minute</tspan><tspan x="310.000000" dy="16.333333">Interpreter (Feurisson) and the group</tspan><tspan x="310.000000" dy="16.333333">mistake: a wrong mission → the group corrects it when Feurisson says it back</tspan></text></g><g class="bGFkZGVyLmRlbGliZXJhdGl2ZQ== part"><g class="shape" ><rect x="30.000000" y="137.000000" width="560.000000" height="89.000000" rx="8.000000" stroke="#475569" fill="#ffffff" style="stroke-width:2;" /></g><text x="310.000000" y="172.000000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:15px"><tspan x="310.000000" dy="0.000000">Deliberative: about a minute</tspan><tspan x="310.000000" dy="16.333333">Strategist and its model (a few seconds per call)</tspan><tspan x="310.000000" dy="16.333333">mistake: often → caught by the Pilot, the Referee, the Reflex</tspan></text></g><g class="bGFkZGVyLmV4ZWN1dGl2ZQ== part"><g class="shape" ><rect x="30.000000" y="244.000000" width="560.000000" height="89.000000" rx="8.000000" stroke="#475569" fill="#ffffff" style="stroke-width:2;" /></g><text x="310.000000" y="279.000000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:15px"><tspan x="310.000000" dy="0.000000">Executive: seconds (a cell takes about 3 s)</tspan><tspan x="310.000000" dy="16.333333">Pilot, Cartographer, Referee</tspan><tspan x="310.000000" dy="16.333333">mistake: a wrong map → caught by the Referee and the Reflex</tspan></text></g><g class="bGFkZGVyLnJlYWN0aXZl key"><g class="shape" ><rect x="30.000000" y="351.000000" width="560.000000" height="104.000000" rx="8.000000" stroke="#1d4ed8" fill="#ffffff" style="stroke-width:3;" /></g><text x="310.000000" y="386.000000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:15px"><tspan x="310.000000" dy="0.000000">Reactive, the fastest and safest: every 10 ms</tspan><tspan x="310.000000" dy="16.000000">it has the last word</tspan><tspan x="310.000000" dy="16.000000">Reflex, on the robot</tspan><tspan x="310.000000" dy="16.000000">mistake: a sensor misses something → an adult puts the robot back</tspan></text></g><mask id="d2-2001920125" maskUnits="userSpaceOnUse" x="-19" y="-19" width="658" height="523">
