version = 1
SPDX-PackageName = "yal-robot-guide"
SPDX-PackageSupplier = "Youth AI Lab (Erasmus+)"
SPDX-PackageDownloadLocation = "https://github.com/Youth-AI-Lab/yal-robot-guide"

# Texts and diagrams: CC BY-SA 4.0.
[[annotations]]
path = ["README.md", "TRIALS.md", "agents/AGENTS.example.md", "interpreter/**", "images/*.svg", "images/*.d2"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Youth AI Lab partners"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# The program of the robot, the simulator, the stack, the checks and the configuration: EUPL-1.2.
[[annotations]]
path = [".devcontainer/**", ".github/**", ".gitignore", ".gitattributes", ".mcp.json", "REUSE.toml", "mat.json",
        "robot/**", "sim/**", "stack/**", "agents/**", "ci/**", "images/render.sh"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Youth AI Lab partners"
SPDX-License-Identifier = "EUPL-1.2"
